<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Property Route Navigator</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#121214" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #09090b;
      color: #fafafa;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      position: relative;
    }

    /* Top Bar - Responsive */
    header {
      background: #121214;
      color: #fafafa;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      z-index: 1000;
      gap: 8px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      min-width: 0;
    }
    .header-title-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-title svg {
      stroke: #3b82f6;
      flex-shrink: 0;
    }
    .stats-badge {
      background: #2563eb;
      color: #ffffff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .btn {
      background: #27272a;
      color: #fafafa;
      border: 1px solid #3f3f46;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: #3f3f46; }
    .btn-active {
      background: #3b82f6;
      color: #ffffff;
      border-color: #60a5fa;
    }
    .btn-active:hover { background: #2563eb; }
    .btn-gps {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid #3b82f6;
      font-weight: 700;
    }
    .btn-gps:hover { background: #1d4ed8; }

    /* Filter Bar */
    .filter-bar {
      background: #18181b;
      border-bottom: 1px solid #27272a;
      padding: 7px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      z-index: 999;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar {
      display: none;
    }
    .filter-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      background: #27272a;
      padding: 4px 8px;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #a1a1aa;
      flex-shrink: 0;
    }
    select, input[type="range"] {
      font-size: 12px;
      border: none;
      background: transparent;
      outline: none;
      cursor: pointer;
      color: #fafafa;
      font-weight: 600;
    }
    select option {
      background: #18181b;
      color: #fafafa;
    }

    /* Map View */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #121214;
    }

    /* High-Performance GPU-Accelerated Dark Tile Invert */
    .dark-tiles .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.1);
      will-change: transform;
      transform: translateZ(0);
    }

    /* Marker Styling */
    .custom-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .pin-bubble {
      display: inline-flex;
      align-items: center;
      background: #2563eb;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      will-change: transform;
      transform: translateZ(0);
      transition: transform 0.1s ease;
      height: 24px;
      padding: 0 8px 0 6px;
      gap: 4px;
    }
    .pin-bubble:hover {
      transform: scale(1.15) translateZ(0);
      background: #1d4ed8;
    }
    .pin-bubble svg {
      width: 13px;
      height: 13px;
      stroke: #ffffff;
      stroke-width: 2.2;
      fill: none;
      flex-shrink: 0;
    }

    /* Pure CSS Zoom Adaptability */
    .map-zoomed-out .pin-bubble {
      width: 22px;
      height: 22px;
      padding: 0;
      justify-content: center;
    }
    .map-zoomed-out .pin-price {
      display: none !important;
    }

    /* Metro Station Pin Styling */
    .metro-station-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      will-change: transform;
    }
    .metro-station-badge {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      transition: transform 0.15s ease;
      flex-shrink: 0;
    }
    .metro-station-badge.interchange {
      width: 25px;
      height: 25px;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(0,0,0,0.4), 0 3px 10px rgba(0, 0, 0, 0.7);
    }
    .metro-station-wrapper:hover .metro-station-badge {
      transform: scale(1.25);
    }
    .metro-station-label {
      background: rgba(18, 18, 20, 0.9);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      display: none;
    }
    /* Show station label when zoomed in */
    #map:not(.map-zoomed-out) .metro-station-label {
      display: inline-block;
    }

    /* Metro Station Popup Styling */
    .metro-popup .leaflet-popup-content-wrapper {
      background: #18181b;
      color: #fafafa;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      padding: 4px 6px;
    }
    .metro-popup .leaflet-popup-tip {
      background: #18181b;
    }

    /* Bottom Sheet / Detail Card */
    #bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #18181b;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.6);
      padding: 16px 18px env(safe-area-inset-bottom, 18px);
      transform: translateY(110%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1001;
      max-width: 600px;
      margin: 0 auto;
      border-top: 1px solid #27272a;
      color: #fafafa;
    }
    #bottom-sheet.open {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 44px;
      height: 4px;
      background: #3f3f46;
      border-radius: 999px;
      margin: 0 auto 12px;
      cursor: pointer;
    }
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -0.3px;
    }
    .sheet-close {
      background: #27272a;
      border: 1px solid #3f3f46;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      transition: background 0.15s ease;
      flex-shrink: 0;
    }
    .sheet-close:hover { background: #3f3f46; color: #ffffff; }
    .sheet-address {
      font-size: 12px;
      color: #a1a1aa;
      margin-bottom: 12px;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .sheet-address svg {
      width: 15px;
      height: 15px;
      stroke: #60a5fa;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .sheet-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .tag {
      background: #27272a;
      color: #fafafa;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #3f3f46;
    }
    .tag svg {
      width: 12px;
      height: 12px;
      stroke: #93c5fd;
    }
    .tag-rent {
      background: #2563eb;
      color: #ffffff;
      border-color: #3b82f6;
      font-size: 13px;
      font-weight: 700;
    }
    .sheet-actions {
      display: flex;
      gap: 8px;
    }
    .btn-nav {
      flex: 2;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: background 0.15s ease;
      border: 1px solid #3b82f6;
    }
    .btn-nav:hover { background: #1d4ed8; }
    .btn-nav svg {
      width: 17px;
      height: 17px;
      stroke: #ffffff;
    }
    .btn-link {
      flex: 1;
      background: #27272a;
      color: #fafafa;
      text-decoration: none;
      border: 1px solid #3f3f46;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 12px;
      font-weight: 600;
      font-size: 12px;
      border-radius: 10px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-link:hover { background: #3f3f46; border-color: #71717a; }
    .btn-link svg {
      width: 14px;
      height: 14px;
      stroke: #fafafa;
    }

    /* User Live GPS Marker */
    .user-location-marker {
      width: 18px;
      height: 18px;
      background: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.9);
      position: relative;
    }

    /* Mobile Media Queries (Under 640px) */
    @media (max-width: 640px) {
      header {
        padding: 8px 12px;
      }
      .header-title-text {
        font-size: 14px;
      }
      .btn {
        padding: 5px 8px;
        font-size: 11px;
      }
      .btn-text-responsive {
        display: none;
      }
      .filter-bar {
        padding: 6px 10px;
        gap: 5px;
      }
      .filter-item {
        padding: 4px 7px;
        font-size: 11px;
      }
      select {
        font-size: 11px;
        max-width: 100px;
      }
      #bottom-sheet {
        padding: 14px 16px env(safe-area-inset-bottom, 14px);
      }
      .sheet-title {
        font-size: 15px;
      }
      .btn-nav {
        padding: 11px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title">
        <!-- Lucide Bike Icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/>
          <circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
        </svg>
        <span class="header-title-text">PropNav</span>
        <span class="stats-badge" id="visible-count">0</span>
      </div>
      <div class="header-actions">
        <!-- Metro Lines Toggle -->
        <button class="btn btn-active" id="btn-metro" onclick="toggleMetroLayer()" title="Toggle Namma Metro Lines & Stations">
          <span>🚇</span><span class="btn-text-responsive" id="metro-label"> Metro</span>
        </button>
        <!-- Dark Map Toggle -->
        <button class="btn" id="btn-theme" onclick="toggleMapTheme()" title="Toggle Dark/Normal OpenStreetMap">
          <span id="theme-icon">🌙</span><span class="btn-text-responsive" id="theme-label"> Dark</span>
        </button>
        <!-- GPS Button -->
        <button class="btn btn-gps" id="btn-gps" onclick="locateUser()">
          <!-- Lucide MapPin Icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>
          </svg>
          <span id="gps-label">Location</span>
        </button>
      </div>
    </header>

    <!-- Filter Bar (Smooth horizontal swipe on mobile) -->
    <div class="filter-bar">
      <div class="filter-item">
        <span>Area:</span>
        <select id="filter-area" onchange="applyFilters()">
          <option value="ALL">All Areas</option>
        </select>
      </div>

      <div class="filter-item">
        <span>BHK:</span>
        <select id="filter-bhk" onchange="applyFilters()">
          <option value="ALL">All</option>
          <option value="1">1 BHK</option>
          <option value="2">2 BHK</option>
        </select>
      </div>

      <div class="filter-item">
        <span>Furnishing:</span>
        <select id="filter-furnishing" onchange="applyFilters()">
          <option value="ALL">All</option>
          <option value="Fully Furnished">Fully</option>
          <option value="Semi Furnished">Semi</option>
          <option value="Unfurnished">Unfurnished</option>
        </select>
      </div>

      <div class="filter-item">
        <span>Max: <b id="rent-label" style="color:#60a5fa;">₹60k</b></span>
        <input type="range" id="filter-rent" min="5000" max="60000" step="1000" value="60000" oninput="updateRentLabel(this.value)" onchange="applyFilters()" />
      </div>

      <button class="btn" style="padding: 4px 8px; font-size: 11px;" onclick="resetFilters()">Reset</button>
    </div>

    <!-- Map Container -->
    <div id="map" class="dark-tiles"></div>

    <!-- Bottom Sheet for Selected Property -->
    <div id="bottom-sheet">
      <div class="sheet-handle" onclick="closeSheet()"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="sheet-title">Property Title</div>
        <button class="sheet-close" onclick="closeSheet()">✕</button>
      </div>
      <div class="sheet-address">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>
        </svg>
        <span id="sheet-address">Full Street / Landmark Address</span>
      </div>
      <div class="sheet-tags">
        <span class="tag tag-rent" id="sheet-rent">₹ 0</span>
        <span class="tag" id="sheet-deposit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span id="sheet-deposit-text">Dep: ₹ 0</span>
        </span>
        <span class="tag" id="sheet-bhk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span id="sheet-bhk-text">0 BHK</span>
        </span>
        <span class="tag" id="sheet-furnishing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="13" rx="2"/><path d="M5 13V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v7"/></svg>
          <span id="sheet-furnishing-text">Furnishing</span>
        </span>
        <span class="tag" id="sheet-area">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
          <span id="sheet-area-text">0 sqft</span>
        </span>
        <span class="tag" id="sheet-distance" style="display:none; background:#1e3a8a; color:#bfdbfe; border-color:#2563eb;">
          <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
          <span id="sheet-distance-text"></span>
        </span>
      </div>
      <div class="sheet-actions">
        <a id="sheet-btn-nav" href="#" target="_blank" class="btn-nav">
          <!-- Lucide Bike Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/>
            <circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
          </svg>
          <span>Start Navigation (Google Maps)</span>
        </a>
        <a id="sheet-btn-link" href="#" target="_blank" class="btn-link">
          <!-- Lucide External Link Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          </svg>
          <span>NoBroker</span>
        </a>
      </div>
    </div>
  </div>

    let map;
    let markersLayer;
    let metroLayer;
    let isMetroVisible = true;
    let isDarkInverted = true;
    let userMarker = null;
    let userLocation = null;
    let currentFiltered = [];

    // Lucide House Icon (White SVG)
    const LUCIDE_HOUSE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`;

    // Lucide Train/Metro Icon (White SVG)
    const LUCIDE_TRAIN_SVG = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="15" x="4" y="3" rx="2.5"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 18-2 3"/><path d="m18 21-2-3"/><circle cx="8" cy="14.5" r="1.2" fill="#ffffff"/><circle cx="16" cy="14.5" r="1.2" fill="#ffffff"/></svg>`;

    function formatCurrency(val) {
      if (!val) return "N/A";
      if (val >= 100000) {
        return "₹ " + (val / 100000).toFixed(val % 100000 === 0 ? 0 : 2) + " L";
      }
      return "₹ " + val.toLocaleString("en-IN");
    }

    function toggleMetroLayer() {
      isMetroVisible = !isMetroVisible;
      const btn = document.getElementById('btn-metro');
      if (isMetroVisible) {
        map.addLayer(metroLayer);
        btn.classList.add('btn-active');
      } else {
        map.removeLayer(metroLayer);
        btn.classList.remove('btn-active');
      }
    }

    function toggleMapTheme() {
      isDarkInverted = !isDarkInverted;
      const mapEl = document.getElementById('map');
      const iconEl = document.getElementById('theme-icon');
      const labelEl = document.getElementById('theme-label');

      if (isDarkInverted) {
        mapEl.classList.add('dark-tiles');
        iconEl.textContent = "🌙";
        if (labelEl) labelEl.textContent = " Dark";
      } else {
        mapEl.classList.remove('dark-tiles');
        iconEl.textContent = "☀️";
        if (labelEl) labelEl.textContent = " Light";
      }
    }

    function updateZoomClass() {
      const isZoomedOut = map.getZoom() < 14;
      map.getContainer().classList.toggle('map-zoomed-out', isZoomedOut);
    }

    function renderMetroNetwork() {
      if (!METRO_DATA || !METRO_DATA.lines) return;

      const LINE_COLORS = {
        'Purple Line': '#a855f7',
        'Green Line': '#10b981',
        'Yellow Line': '#facc15'
      };

      // 1. Draw Route Lines
      Object.keys(METRO_DATA.lines).forEach(lineName => {
        const line = METRO_DATA.lines[lineName];
        if (!line.coords || line.coords.length === 0) return;

        const color = LINE_COLORS[lineName] || line.color || '#a855f7';

        // Outer glow
        L.polyline(line.coords, {
          color: '#000000',
          weight: 6,
          opacity: 0.5,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(metroLayer);

        // Solid colored track
        L.polyline(line.coords, {
          color: color,
          weight: 4,
          opacity: 0.95,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(metroLayer);
      });

      // 2. Draw Stations with Lucide Metro/Train Badges
      if (METRO_DATA.stations) {
        METRO_DATA.stations.forEach(st => {
          const color = LINE_COLORS[st.line] || st.color || '#a855f7';
          const isInterchange = st.interchange;
          const badgeClass = isInterchange ? 'metro-station-badge interchange' : 'metro-station-badge';

          const iconHtml = `
            <div class="metro-station-wrapper">
              <div class="${badgeClass}" style="background: ${color};">
                ${LUCIDE_TRAIN_SVG}
              </div>
              <span class="metro-station-label">${st.name}</span>
            </div>
          `;

          const metroIcon = L.divIcon({
            className: 'custom-div-icon',
            html: iconHtml,
            iconSize: isInterchange ? [26, 26] : [22, 22],
            iconAnchor: isInterchange ? [13, 13] : [11, 11]
          });

          const marker = L.marker([st.lat, st.lon], { icon: metroIcon });

          // Station Popup Content
          marker.on('click', (e) => {
            L.DomEvent.stopPropagation(e);

            let distanceHtml = '';
            if (userLocation) {
              const d = calculateDistance(userLocation.lat, userLocation.lon, st.lat, st.lon);
              distanceHtml = `<div style="font-size: 11px; color: #60a5fa; margin: 4px 0 8px;">📍 ${d} km from you</div>`;
            }

            const popupHtml = `
              <div style="font-family: inherit; min-width: 175px; padding: 2px;">
                <div style="font-weight: 700; font-size: 14px; margin-bottom: 3px; display:flex; align-items:center; gap:6px; color:#ffffff;">
                  <span style="background:${color}; border-radius:50%; width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center;">${LUCIDE_TRAIN_SVG}</span>
                  <span>${st.name}</span>
                </div>
                <div style="font-size: 11px; font-weight: 600; color: ${color}; margin-bottom: 4px;">
                  ${st.line} ${st.interchange ? '• Interchange' : ''}
                </div>
                ${distanceHtml}
                <a href="https://www.google.com/maps/dir/?api=1&destination=${st.lat},${st.lon}&travelmode=two_wheeler"
                   target="_blank"
                   style="display: flex; align-items: center; justify-content: center; gap: 5px; background: #2563eb; color: #ffffff; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-top: 6px;">
                  🏍️ Directions to Metro
                </a>
              </div>
            `;
            marker.bindPopup(popupHtml, { className: 'metro-popup' }).openPopup();
          });

          metroLayer.addLayer(marker);
        });
      }
    }

    function initMap() {
      // Default center: Mahadevapura / KR Puram region in Bangalore
      map = L.map('map', {
        zoomControl: true,
        tap: false,
        preferCanvas: true
      }).setView([12.9922, 77.6902], 13);

      // 100% Pure OpenStreetMap tile server
      L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19,
        updateWhenIdle: true
      }).addTo(map);

      // Metro layer (rendered below property markers)
      metroLayer = L.layerGroup().addTo(map);
      renderMetroNetwork();

      // Dedicated layer group for properties
      markersLayer = L.layerGroup().addTo(map);

      // Instant CSS zoom toggle without JS loop overhead
      map.on('zoomend', updateZoomClass);
      updateZoomClass();

      populateAreaFilter();
      applyFilters();

      // Close bottom sheet when tapping map background
      map.on('click', () => {
        closeSheet();
      });

      // Register PWA Service Worker for offline and fast caching
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    function populateAreaFilter() {
      const areaSelect = document.getElementById('filter-area');
      const areas = [...new Set(PROPERTIES_DATA.map(p => p.search_area))].sort();
      areas.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        areaSelect.appendChild(opt);
      });
    }

    function updateRentLabel(val) {
      document.getElementById('rent-label').textContent = "₹" + Math.round(val / 1000) + "k";
    }

    function resetFilters() {
      document.getElementById('filter-area').value = "ALL";
      document.getElementById('filter-bhk').value = "ALL";
      document.getElementById('filter-furnishing').value = "ALL";
      document.getElementById('filter-rent').value = 60000;
      updateRentLabel(60000);
      applyFilters();
    }

    function applyFilters() {
      const area = document.getElementById('filter-area').value;
      const bhk = document.getElementById('filter-bhk').value;
      const furnishing = document.getElementById('filter-furnishing').value;
      const maxRent = parseInt(document.getElementById('filter-rent').value, 10);

      currentFiltered = PROPERTIES_DATA.filter(p => {
        if (area !== "ALL" && p.search_area !== area) return false;
        if (bhk !== "ALL" && String(p.bhk) !== bhk) return false;
        if (furnishing !== "ALL" && p.furnishing !== furnishing) return false;
        if (p.rent && p.rent > maxRent) return false;
        return true;
      });

      document.getElementById('visible-count').textContent = currentFiltered.length + " places";
      renderMarkers();
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const bounds = [];

      currentFiltered.forEach(p => {
        if (!p.lat || !p.lon) return;

        const rentText = p.rent ? "₹" + Math.round(p.rent / 1000) + "k" : (p.bhk ? p.bhk + "BHK" : "Home");
        const customIcon = L.divIcon({
          className: "custom-div-icon",
          html: `<div class="pin-bubble">${LUCIDE_HOUSE_SVG}<span class="pin-price">${rentText}</span></div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([p.lat, p.lon], { icon: customIcon });
        marker.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          showPropertySheet(p);
        });

        markersLayer.addLayer(marker);
        bounds.push([p.lat, p.lon]);
      });

      if (bounds.length > 0 && !userLocation) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    function showPropertySheet(p) {
      document.getElementById('sheet-title').textContent = `${p.bhk || ''} BHK in ${p.locality || p.search_area}`;
      document.getElementById('sheet-address').textContent = p.street || p.title || 'Address available in listing';
      document.getElementById('sheet-rent').textContent = formatCurrency(p.rent);
      document.getElementById('sheet-deposit-text').textContent = "Dep: " + formatCurrency(p.deposit);
      document.getElementById('sheet-bhk-text').textContent = (p.bhk || '?') + " BHK";
      document.getElementById('sheet-furnishing-text').textContent = p.furnishing || "Furnishing N/A";
      document.getElementById('sheet-area-text').textContent = (p.area_sqft || '?') + " sqft";

      // Distance tag if user location is available
      const distanceEl = document.getElementById('sheet-distance');
      if (userLocation && p.lat && p.lon) {
        const d = calculateDistance(userLocation.lat, userLocation.lon, p.lat, p.lon);
        document.getElementById('sheet-distance-text').textContent = `${d} km from you`;
        distanceEl.style.display = "inline-flex";
      } else {
        distanceEl.style.display = "none";
      }

      // Direct Google Maps two-wheeler route link
      const googleMapsNavUrl = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}&travelmode=two_wheeler`;
      document.getElementById('sheet-btn-nav').href = googleMapsNavUrl;

      // Direct NoBroker listing URL
      const linkBtn = document.getElementById('sheet-btn-link');
      if (p.url) {
        linkBtn.href = p.url;
        linkBtn.style.display = "flex";
      } else {
        linkBtn.style.display = "none";
      }

      document.getElementById('bottom-sheet').classList.add('open');
      map.panTo([p.lat, p.lon]);
    }

    function closeSheet() {
      document.getElementById('bottom-sheet').classList.remove('open');
    }

    function locateUser() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser");
        return;
      }

      const label = document.getElementById('gps-label');
      if (label) label.textContent = "Locating...";

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude
          };

          if (userMarker) {
            userMarker.setLatLng([userLocation.lat, userLocation.lon]);
          } else {
            const gpsIcon = L.divIcon({
              className: "gps-div-icon",
              html: `<div class="user-location-marker"></div>`,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });
            userMarker = L.marker([userLocation.lat, userLocation.lon], { icon: gpsIcon }).addTo(map);
          }

          map.setView([userLocation.lat, userLocation.lon], 14);
          if (label) label.textContent = "You";
        },
        (err) => {
          alert("Could not get your location: " + err.message);
          if (label) label.textContent = "Location";
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    window.onload = initMap;
  </script>
</body>
</html>
